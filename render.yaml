services:
  - type: web
    name: learnmate-jee
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_DEV_AUTH_BYPASS
        value: "false"
      - key: AI_REQUESTS_PER_MINUTE
        value: "20"
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_THINKING
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_ANALYZE
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_LIVE
        value: gemini-3.8-live
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DATABASE_ID
        sync: false
      - key: VITE_API_BASE_URL
        value: ""
      - key: VITE_WS_BASE_URL
        sync: false
      - key: VITE_ADMIN_EMAILS
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_DATABASE_ID
        sync: false

